# ======================= Settings ======================= {{{
include "../module/waybar.conf"
font pango: IosevkaTermSlab Nerd Font Bold 16
# titlebar_border_tickness 0
# titlebar_padding 0
xwayland enable
# floating_minimum_size 1280 x 720
# floating_maximum_size 1920 x 1080
# }}}
# ======================= Variables ======================= {{{
set {
    $output_primary   'LG Electronics LG Ultra HD 0x000641E4'
    $output_secondary 'BNQ BenQ GW2470 7AG00620019'
    $output_tertiary  'LG Electronics 2D FHD LG TV 0x01010101'

    $EDITOR2    $term -T 'temacs' -e emacsclient -nw
    $EDITOR     emacsclient -c
    $BROSWER    "$BROWSER"

    $wph "${XDG_DATA_HOME:-$HOME/.local/share}/mainbg"
    $wpv "${XDG_DATA_HOME:-$HOME/.local/share}/mainbg"
}
# }}}
# ======================= Outputs ======================= {{{
output $output_primary {
    # mode 1920x1080@60.00Hz
    pos 0 0
    # scale 2
    bg $wph fill
}

output $output_secondary {
    pos 3840 30
    transform 90
    scale 0.5
    # disable
    bg $wpv fill
}

output $output_tertiary {
    # disable
    pos 0 -2160
    bg $wph fill
    scale 0.5
}
# }}}
# ======================= Multi-Monitor ======================= {{{
mode "output" {
    bindsym {
        1                     exec swaymsg output DP-1 enable,  HDMI-A-1 disable,        output HDMI-A-2 disable
        q                     exec swaymsg output DP-1 disable, HDMI-A-1 enable,         output HDMI-A-2 disable
        2                     exec swaymsg output DP-1 enable,  output HDMI-A-1 disable, output HDMI-A-2 enable
        w                     exec swaymsg output DP-1 enable,  output HDMI-A-1 enable,  output HDMI-A-2 disable
        3                     exec swaymsg output DP-1 enable,  output HDMI-A-1 enable,  output HDMI-A-2 enable
        m                     exec swaymsg output DP-1 toggle
        s                     exec swaymsg output HDMI-A-1 toggle
        v                     exec swaymsg output HDMI-A-2 toggle
        Escape mode "default"
        Return mode "default"
    }
}

workspace {
    0 output $output_primary
    1 output $output_primary
    2 output $output_primary
    3 output $output_primary
    4 output $output_primary
    5 output $output_primary
    6 output $output_primary
    7 output $output_primary
    8 output $output_primary
    9 output $output_tertiary $output_primary

    10 output $output_secondary $output_tertiary
    11 output $output_secondary $output_tertiary
    12 output $output_secondary $output_tertiary
    13 output $output_secondary $output_tertiary
    14 output $output_secondary $output_tertiary

    15 output $output_tertiary $output_secondary
    16 output $output_tertiary $output_secondary
    17 output $output_tertiary $output_secondary
    18 output $output_tertiary $output_secondary
    19 output $output_tertiary $output_secondary

    20 output $output_tertiary $output_primary
    21 output $output_tertiary $output_primary
    22 output $output_tertiary $output_primary
    23 output $output_tertiary $output_primary
    24 output $output_tertiary $output_primary
}

bindsym {
    $M+q                      workspace number 15
    $M+w                      workspace number 16
    $M+e                      workspace number 17
    $M+r                      workspace number 18
    $M+t                      workspace number 19

    $M+y                      workspace number 10
    $M+u                      workspace number 11
    $M+i                      workspace number 12
    $M+o                      workspace number 13
    $M+p                      workspace number 14

    $M+$C+q                   move container to workspace number 15
    $M+$C+w                   move container to workspace number 16
    $M+$C+e                   move container to workspace number 17
    $M+$C+r                   move container to workspace number 18
    $M+$C+t                   move container to workspace number 19

    $M+$C+y                   move container to workspace number 10
    $M+$C+u                   move container to workspace number 11
    $M+$C+i                   move container to workspace number 12
    $M+$C+o                   move container to workspace number 13
    $M+$C+p                   move container to workspace number 14
}

# }}}
# ======================= Window Management ======================= {{{
assign {
    [title=".*[Pp]rivate.*"]           workspace 14
    [title="Mozilla Firefox Private Browsing"] workspace 14
    [title="temacs"]                   workspace 0
    [title="Email"]                    workspace 12
    [title="ORG"]                      workspace 0

    [app_id="baseterm"]                workspace 12
    [app_id="brave|librewolf"]         workspace 3
    [app_id="chromium"]                workspace 13
    [app_id="code"]                    workspace 12
    [app_id="com.github.wwmm.easyeffects"] workspace 7
    [app_id="emacs[client]?"]          workspace 1
    [app_id="firefox"]                 workspace 2
    [app_id="libreoffice*"]            workspace 4
    [app_id="mpv"]                     workspace 9
    [app_id="qutebrowser"]             workspace 11
    [class="Ferdium"]                  workspace 13
    [class="sioyek|org.pwmt.zathura"]  workspace 11
    [class="term-emacsclient"]         workspace 1
    [class="xfreerdp"]                 workspace 6

    [app_id="org.remmina.Remmina"]     workspace 8
    [app_id="thunderbird"]             workspace 18
    [app_id="winboat"]                 workspace 8

}
# }}}
# ======================= Autostart ======================= {{{
exec {
    dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

    wlsunset -t 2400 -T 6500 -S 06:30 -s 20:00 -d 1800

    sleep 20 && emacsclient -e '(doom/quickload-session t)' -c
    # sleep 20 && $term -T 'term-emacs' -e emacsclient -e '(doom/load-session t)' -nw &

    swayidle -w \
    timeout 180 'swaymsg "output * dpms off"' resume 'swaymsg "output * dpms on"'
    # timeout 300 'swaylock -f -c 000000' \
    # before-sleep 'swaylock'

    sleep 35 && $BROWSER
    sleep 35 && easyeffects
}
# }}}
