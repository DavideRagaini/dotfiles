# ======================= Settings ======================= {{{
include "../module/waybar.conf"
font pango: IosevkaTermSlab Nerd Font Bold 10
default_orientation auto
xwayland enable
# floating_minimum_size 1280 x 720
# floating_maximum_size 1920 x 1080
# }}}
# ======================= Variables ======================= {{{
set {
    $output_laptop           'BOE 0x0B76 Unknown'

    $output_home_primary     'LG Electronics LG Ultra HD 0x000641E4'
    $output_home_vertical    'BNQ BenQ GW2470 7AG00620019'
    $output_home_secondary   'LG Electronics 2D FHD LG TV 0x01010101'

    $output_work_primary     'LG Electronics LG FHD 0x000412A6'
    $output_work_vertical    'LG Electronics LG FHD 0x0004134D'
    $output_work_secondary   'BNQ BenQ BL2381T D3M0091801Q'

    $EDITOR2    $term -T 'temacs' -e emacsclient -nw
    $EDITOR     emacsclient -c
    $BROSWER    "$BROWSER"

    $wph "${XDG_DATA_HOME:-$HOME/.local/share}/mainbg"
    $wpv "${XDG_DATA_HOME:-$HOME/.local/share}/mainbg"
}
# }}}
# ======================= Inputs ======================= {{{
input "13364:480:Keychron_Keychron_Q11" {
    xkb_options "altwin:swap_lalt_lwin"
}

input "1:1:AT_Translated_Set_2_keyboard" {
    xkb_options "ctrl:swapcaps,altwin:swap_lalt_lwin"
}

input "5050:24:Barcode_Reader" {
    xkb_options "ctrl:swapcaps,altwin:swap_lalt_lwin"
}
# }}}
# ======================= Outputs ======================= {{{
output * bg $wph fill
# output * bg "#000000" solid_color

output $output_laptop {
    # scale 1.25
    pos 0 1200
}

output $output_home_primary {
    pos 1920 1080
    scale 2
}

output $output_home_vertical {
    pos 3840 240
    transform 90
    # bg $wpv fill
}

output $output_home_secondary {
    pos 1920 0
}

workspace {
    1 output $output_work_primary $output_home_primary
    2 output $output_work_primary $output_home_primary
    3 output $output_work_primary $output_home_primary
    4 output $output_work_primary $output_home_primary
    5 output $output_work_primary $output_home_primary
    6 output $output_work_primary $output_home_primary
    7 output $output_work_primary $output_home_primary
    8 output $output_work_primary $output_home_primary
    9 output $output_work_primary $output_home_primary
    0 output $output_work_primary $output_home_primary

    10 output $output_work_secondary $output_home_secondary
    11 output $output_work_secondary $output_home_secondary
    12 output $output_work_secondary $output_home_secondary
    13 output $output_work_secondary $output_home_secondary
    14 output $output_work_secondary $output_home_secondary

    15 output $output_work_vertical $output_home_vertical
    16 output $output_work_vertical $output_home_vertical
    17 output $output_work_vertical $output_home_vertical
    18 output $output_work_vertical $output_home_vertical
    19 output $output_work_vertical $output_home_vertical

    20 output $output_laptop
    21 output $output_laptop
    22 output $output_laptop
    23 output $output_laptop
    24 output $output_laptop
}
# }}}
# ======================= Custom bindings ======================= {{{
bindsym --input-device="5050:24:Barcode_Reader" {
    $M+q                      workspace number 15
    $M+w                      workspace number 16
    $M+e                      workspace number 17
    $M+r                      workspace number 18
    $M+t                      workspace number 19

    $M+y                      workspace number 10
    $M+u                      workspace number 11
    $M+i                      workspace number 12
    $M+o                      workspace number 13
    $M+p                      workspace number 14

    $M+$C+q                   move container to workspace number 15
    $M+$C+w                   move container to workspace number 16
    $M+$C+e                   move container to workspace number 17
    $M+$C+r                   move container to workspace number 18
    $M+$C+t                   move container to workspace number 19

    $M+$C+y                   move container to workspace number 10
    $M+$C+u                   move container to workspace number 11
    $M+$C+i                   move container to workspace number 12
    $M+$C+o                   move container to workspace number 13
    $M+$C+p                   move container to workspace number 14
}

bindsym --input-device="1:1:AT_Translated_Set_2_keyboard" {
