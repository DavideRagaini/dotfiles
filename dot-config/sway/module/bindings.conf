# ======================= Constant ======================= {{{
floating_modifier $M          normal

set $pip floating enable, resize set 12 ppt 12 ppt
set $dropdown exec sway_dropdown_terminal

set $audio-mute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && volume-dunstify
# set $audio-mute exec pactl set-sink-volume @DEFAULT_SINK@ toggle

set $audio-volume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@
# set $audio-volume exec pactl set-sink-volume @DEFAULT_SINK@ # +1% -1%

bindsym {
    XF86AudioStop             $dropdown mixer wiremix 65 35

    XF86Explorer              workspace back_and_forth

    XF86AudioPlay             exec tppctl invert
    $M+XF86AudioPlay          exec dmpc toggle

    XF86AudioNext             exec dmpc next
    $M+XF86AudioNext          exec tppctl seek 10

    XF86AudioPrev             exec dmpc prev
    $M+XF86AudioPrev          exec tppctl seek -10

    XF86AudioRaiseVolume      $audio-volume 1%+ && volume-dunstify

    XF86AudioLowerVolume      $audio-volume 1%- && volume-dunstify

    XF86AudioMute             $audio-mute

    $M+XF86AudioMute          exec output-audio

    XF86AudioMicMute          exec wpctl set-mute @DEFAULT_SOURCE@ toggle
    $M+XF86AudioMicMute       exec wpctl set-mute @DEFAULT_SOURCE@ 1

    XF86HomePage              exec swaymsg \"output * dpms toggle\"
    $M+XF86HomePage           exec wlopm --toggle \"*\"

    XF86Calculator            $dropdown calc "wcalc -P -1 -c -q --ints -C -p -r --remember" 65 65

    XF86Favorites             exec btop
    $M+XF86Favorites          exec htop

    XF86MonBrightnessDown     exec brightnessctl s 2%- && brightness-dunstify
    $M+XF86MonBrightnessDown  exec brightnessctl s 10%- && brightness-dunstify
    $M+$C+XF86MonBrightnessDown mode "brightness"

    XF86MonBrightnessUp       exec brightnessctl s +2% && brightness-dunstify
    $M+XF86MonBrightnessUp    exec brightnessctl s +10% && brightness-dunstify
    $M+$C+XF86MonBrightnessUP mode "brightness"

    $M+XF86Back               exec dmpc prev
    $A+XF86Back               exec tppctl seek -10
    $A+$C+XF86Back            exec tppctl prev

    XF86Forward               exec dmpc next
    $M+XF86Forward            exec dmpc next
    $A+XF86Forward            exec tppctl seek 10
    $A+$C+XF86Forward         exec tppctl next

    $M+Print                  exec maimpick
    $M+$C+Print               exec flameshot

    # XF86Mail                  exec swaymsg [app_id="ferdium"] scratchpad show || ferdium

#    XF86Search              exec
#    XF86Launch5             exec
#    XF86Launch6             exec
#    XF86Launch7             exec mixer
#    M-XF86Launch8           exec tppctl seek -10
#    M-XF86Launch9           exec tppctl seek 10
# }}}
# ======================= Function Row ======================= {{{
    $M+$C+Escape              $dropdown sysmon htop
    $M+$S+Escape              $dropdown sysmon btop

    $M+F1                     exec sway-bindings

    $M+F3                     exec wifi-toggle

    $A+z                      exec sway-power-outputs toggle
    $M+F9                     exec sway-power-outputs toggle
    $M+$C+F9                  exec sway-power-outputs on
    $M+$S+F9                  exec sway-power-outputs off

    $M+F10                    mode "output"

    # $M+F12                    exec swaymsg exit
# ======================= Number Row ======================= {{{
    $M+grave                  exec dunstctl close
    # $M+grave                  exec makoctl dismiss -a
    $M+$C+grave               exec dunstctl history-pop

    $M+1                      workspace number 1
    $M+2                      workspace number 2
    $M+3                      workspace number 3
    $M+4                      workspace number 4
    $M+5                      workspace number 5
    $M+6                      workspace number 6
    $M+7                      workspace number 7
    $M+8                      workspace number 8
    $M+9                      workspace number 9
    $M+0                      workspace number 0

    $M+$C+1                   move container to workspace number 1
    $M+$C+2                   move container to workspace number 2
    $M+$C+3                   move container to workspace number 3
    $M+$C+4                   move container to workspace number 4
    $M+$C+5                   move container to workspace number 5
    $M+$C+6                   move container to workspace number 6
    $M+$C+7                   move container to workspace number 7
    $M+$C+8                   move container to workspace number 8
    $M+$C+9                   move container to workspace number 9
    $M+$C+0                   move container to workspace number 0

    $M+minus                  scratchpad show
    $M+$C+minus               move scratchpad

    $M+Backspace              exec sysact Shutdown
    $M+$C+Backspace           exec sysact Suspend_and_hibernate
    $M+$S+Backspace           exec sysact
# }}}
# ======================= First Row ======================= {{{
    $M+Tab                    exec $focus_prev_window
    $M+$C+Tab                 workspace back_and_forth

    $A+q                      focus output right
    # $M+$C+q                 exec swaynag -T warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

    $A+w                      exec $BROWSER
    $A+e                      exec emacsclient -c
    # $M+$C+e                   exec $EDITOR2

    $A+r                      $dropdown files yazi
    $A+$C+r                   mode "resize"
    $A+$S+r                   exec swaymsg reload && kanshictl reload


    $A+t                      layout tabbed
    # $M+$C+t                   layout tabbed

    $M+$S+i                   focus tiling

    $M+$S+o                   focus mode_toggle
    $A+o                      mode "opacity_editor"

    $M+$S+p                   exec dmpv
    # $M+$C+p                   exec dmpv queue
    # $M+$S+p                   exec dmpv aplay "$(wl-paste)"

    # $M+y                      exec swaymsg [app_id="agenda"] scratchpad show || $term -a "agenda" emacs -nw

    $M+bracketleft            workspace prev
    $M+bracketright           workspace next
# }}}
# ======================= Second Row ======================= {{{
    $M+a                      workspace number 20
    $M+s                      workspace number 21
    $M+d                      workspace number 22
    $M+f                      workspace number 23
    $M+g                      workspace number 24

    $M+$C+a                   move container to workspace number 20
    $M+$C+s                   move container to workspace number 21
    $M+$C+d                   move container to workspace number 22
    $M+$C+f                   move container to workspace number 23
    $M+$C+g                   move container to workspace number 24

    $A+a                      focus parent
    $A+$C+a                   focus child

    $A+s                      sticky toggle
    $A+$C+s                   layout stacking
    $A+$S+s                   exec maimpick

    $A+d                      exec $drun
    $A+$C+d                   exec via -r
    $A+$S+d                   exec via -a
    $A+$C+$S+d                mode "launcher"

    $A+f                      $maximize
    $A+$C+f                   fullscreen

    $A+g                      gaps toggle
    $A+$C+g                   mode $gaps_editor

    $M+h                      focus left
    $M+j                      focus down
    $M+k                      focus up
    $M+l                      focus right

    $M+$C+h                   move left
    $M+$C+j                   move down
    $M+$C+k                   move up
    $M+$C+l                   move right

    $M+$C+$S+h                move workspace to output left
    $M+$C+$S+j                move workspace to output down
    $M+$C+$S+k                move workspace to output up
    $M+$C+$S+l                move workspace to output right

    $M+semicolon              [con_mark=_prev] focus

    $M+apostrophe             $dropdown calc "wcalc -P -1 -c -q --ints -C -p -r --remember" 65 65

    $M+backslash              $pip, move position 88 ppt 88 ppt
    $M+$C+backslash           $pip, move position 88 ppt 0  ppt
    $M+$S+backslash           $pip, move position 0  ppt 88 ppt
    $M+$C+$S+backslash        $pip, move position 0  ppt 0  ppt

    $A+$S+l                   exec swaylock -f && sleep 10 && sway-power-outputs off

# }}}
# ======================= Third Row ======================= {{{
    $M+z                      exec abrv
    $M+$C+x                   kill
    $M+$S+x                   mode "xkill"

    $M+c                      layout toggle all
    $M+$C+c                   layout toggle split

    $M+v                      layout tabbed

    $M+b                      split toggle
    $M+$S+b                   resize set height 33 ppt
    $M+$C+b                   killall -SIGUSR1 waybar

    # $M+n                      exec swaymsg [app_id="flemacs"] scratchpad show || $term -a "flemacs" emacs -nw --eval='(dr/start-elfeed)'
    $M+n                      exec swaymsg [title="agenda"] scratchpad show || emacs -T "agenda"
    $M+$S+n                   exec swaymsg [title="flemacs"] scratchpad show || emacs --eval='(dr/start-elfeed)' -T "flemacs"

    $M+m                      $dropdown music spotify_player
    $M+$C+m                   $dropdown music mp

    $M+comma                  exec dmpc toggle
    $M+$C+comma               mode $music
    $M+$S+comma               mode $mpv

    $M+period                 exec tppctl invert
    $M+$C+period              exec tppctl pauseall
    $M+$S+period              exec tppctl

    $M+slash                  $dropdown mixer wiremix 65 35
# }}}
# ======================= Middle Keys ======================= {{{
    $M+space                  [con_mark=_prev] focus
    $M+$C+space               floating toggle

    $M+Delete                 exec cliphist list | bemenu -l 15 -p "Clipboard:" | cliphist decode | wl-copy
    $M+Insert                 exec cliphist list | bemenu -l 15 -p "Clipboard:" | cliphist decode | wl-copy
    $M+$C+Insert              exec notify-send "Clipboard" "$(wl-paste)"

    $M+Return                 $dropdown dropdown "tmux new-session -A -s dropdown"
    $M+$C+Return              exec swaymsg [app_id="scratch"] scratchpad show || $term -a scratch -e tmux new-session -A -s scratch
    $M+$S+Return              exec $term tmux

    $M+Up                     $audio-volume 1%+ && volume-dunstify
    $M+$C+Up                  exec output-audio && volume-dunstify
    $M+$S+Up                  mode "wpctl"

    $M+Down                   $audio-volume 1%- && volume-dunstify
    $M+$C+Down                $audio-mute

    $M+Left                   exec tppctl seek -10
    $M+$C+Left                exec dmpc prev

    $M+Right                  exec tppctl seek +10
    $M+$C+Right               exec dmpc next
}
# ======================= Gestures ======================= {{{
# Allow switching between workspaces with left and right swipes
bindgesture {
    hold:2                    exec tppctl invert
    hold:3                    exec dmpc toggle
    hold:4                    exec tppctl pauseall
    hold:5                    exec tppctl toggle

    swipe:up                  exec $focus_prev_window
    swipe:down                workspace back_and_forth

    swipe:right               workspace prev
    swipe:left                workspace next

    swipe:4:up                brightnessctl set +2% && brightness-dunstify
    swipe:4:down              brightnessctl set 2%- && brightness-dunstify
    swipe:4:right             $audio-volume 1%+ && volume-dunstify
    swipe:4:left              $audio-volume 1%- && volume-dunstify

    pinch:outward             mode "resize" 

    pinch:inward+up           move up
    pinch:inward+down         move down

    pinch:inward+left         move left
    pinch:inward+right        move right

}
# ======================= Keys Chords ======================= {{{
mode "launcher" {
    bindsym {
         e                    exec emacsclient -c
         f                    exec firefox
         q                    exec qutebrowser
         t                    exec footclient
         r                    exec foot
         m                    exec ferdium
         Return               mode "default"
         Escape               mode "default"
    }
}

mode "resize" {
    bindsym {
         1                    resize set height 10 px
         2                    resize set height 20 px
         3                    resize set height 30 px
         4                    resize set height 40 px
         5                    resize set height 50 px
         6                    resize set height 60 px
         7                    resize set height 70 px
         8                    resize set height 80 px
         9                    resize set height 90 px
         0                    resize set height 100 px
         l                    resize shrink width 10 px
         j                    resize grow height 10 px
         k                    resize shrink height 10 px
         h                    resize grow width 10 px
         t                    resize set height 33 px
         Left                 resize shrink width 10 px
         Down                 resize grow height 10 px
         Up                   resize shrink height 10 px
         Right                resize grow width 10 px
         Return               mode "default"
         Escape               mode "default"
    }
}

mode "opacity_editor" {
    bindsym {
             h                opacity set 1
             l                opacity set 0.1
             j                opacity minus 0.05
             k                opacity plus 0.05
             1                opacity set 0.1
             2                opacity set 0.2
             3                opacity set 0.3
             4                opacity set 0.4
             5                opacity set 0.5
             6                opacity set 0.6
             7                opacity set 0.7
             8                opacity set 0.8
             9                opacity set 0.9
             0                opacity set 1
             Return           mode "default"
             Escape           mode "default"
    }
}

mode "gaps_editor" {
    bindsym {
             i                gaps inner current plus 1
             $C+i             gaps inner current minus 1
             $S+i             gaps inner current toggle 2
             o                gaps outer current plus 1
             $C+o             gaps outer current minus 1
             $S+o             gaps outer current toggle 2
             r                gaps inner current set $gaps_inner; gaps outer current set $gaps_outer
             Return           mode "default"
             Escape           mode "default"
    }
}

mode "music" {
    bindsym {
             t                exec dmpc toggle
             n                exec dmpc next
             p                exec dmpc prev
             s                exec dmpc shuffle
             r                exec dmpc repeat
             u                exec dmpc volume +1
             d                exec dmpc volume -1
             o                exec dmpc-notify
             1                exec dmpc volume 10
             2                exec dmpc volume 20
             3                exec dmpc volume 30
             4                exec dmpc volume 40
             5                exec dmpc volume 50
             6                exec dmpc volume 60
             7                exec dmpc volume 70
             8                exec dmpc volume 80
             9                exec dmpc volume 90
             0                exec dmpc volume 100
             Return           mode "default"
             Escape           mode "default"
    }
}

mode "mpv" {
    bindsym {
             t                exec tppctl toggle
             i                exec tppctl invert
             a                exec tppctl pauseall
             n                exec tppctl next
             p                exec tppctl prev
             u                exec tppctl volume +1
             d                exec tppctl volume -1
             o                exec tppctl-notify
             1                exec tppctl volume 10
             2                exec tppctl volume 20
             3                exec tppctl volume 30
             4                exec tppctl volume 40
             5                exec tppctl volume 50
             6                exec tppctl volume 60
             7                exec tppctl volume 70
             8                exec tppctl volume 80
             9                exec tppctl volume 90
             0                exec tppctl volume 100
             Return           mode "default"
             Escape           mode "default"
    }
}

mode "wpctl" {
    bindsym {
             t                $audio-mute
             n                $audio-volume 1%+ && volume-dunstify
             p                $audio-volume 1%- && volume-dunstify
             k                $audio-volume 1%+ && volume-dunstify
             j                $audio-volume 1%- && volume-dunstify
             1                $audio-volume 0.10 && volume-dunstify
             2                $audio-volume 0.20 && volume-dunstify
             3                $audio-volume 0.30 && volume-dunstify
             4                $audio-volume 0.40 && volume-dunstify
             5                $audio-volume 0.50 && volume-dunstify
             6                $audio-volume 0.60 && volume-dunstify
             7                $audio-volume 0.70 && volume-dunstify
             8                $audio-volume 0.80 && volume-dunstify
             9                $audio-volume 0.90 && volume-dunstify
             0                $audio-volume 1.00 && volume-dunstify
             m                $audio-mute
             Return           mode "default"
             Escape           mode "default"
    }
}

mode "brightness" {
    bindsym {
         1                    exec brightnessctl set 10% && brightness-dunstify
         2                    exec brightnessctl set 20% && brightness-dunstify
         3                    exec brightnessctl set 30% && brightness-dunstify
         4                    exec brightnessctl set 40% && brightness-dunstify
         5                    exec brightnessctl set 50% && brightness-dunstify
         6                    exec brightnessctl set 60% && brightness-dunstify
         7                    exec brightnessctl set 70% && brightness-dunstify
         8                    exec brightnessctl set 80% && brightness-dunstify
         9                    exec brightnessctl set 90% && brightness-dunstify
         0                    exec brightnessctl set 100% && brightness-dunstify
         Plus                 exec brightnessctl set +2% && brightness-dunstify
         Minus                exec brightnessctl set 2%- && brightness-dunstify
         Return               mode "default"
         Escape               mode "default"
    }
}

mode "xkill" {
    bindsym {
        --whole-window button1 kill
        # button 2 exec swaymsg -t get_tree | jq '.. | select(.type?) | select(.focused==true) | .pid' | xargs kill
        Escape mode "default"
        Return mode "default"
    }
}
# }}}
